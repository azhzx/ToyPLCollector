hello_world = '''import std;

// 函数与字符串拼接
func greet(name) {
	return "Hello, " + name + "!";
}

println(greet("Stamon2"));

//面向对象设计
class Counter {
	def count;

	func __init__(self, start) {
		self.count = start;
	}

	func add(self, n) {
		self.count += n;
		return self.count;
	}
}

def c = Counter.new(1);

//流程控制
for i in { 1, 2, 3 } {
	println(c.add(i));
}
