description = "实验性系统级编程语言，灵感来自 Rust 与 Go：默认移动语义、编译期借用检查、跨过程逃逸分析（非逃逸值留在栈上）、确定性析构、泛型与 trait，编译到 C11，并内置 MIR 解释器。An experimental systems language by riddle-lang — technology preview."
