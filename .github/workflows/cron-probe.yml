name: Cron probe

# TEMPORARY diagnostic: verifies that GitHub's schedule trigger works for
# this repository at all (the Deploy website catch-up job depends on it).
# Push-only change outside deploy paths -> does not trigger a site deploy.
# Delete this file once the probe has been observed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "cron probe alive at $(date -u)"
