name: Deploy website

# main 收到合并后的 push → 重建站点并发布到 GitHub Pages
# (页面地址 = https://coll.i2pl.com/，构建产物内含 CNAME 文件)
#
# 每 5 分钟的 schedule 兜底：native auto-merge 用 GITHUB_TOKEN 合并，其 push
# 事件不会触发 workflow（PR #7 的教训），所以 bot 合并的 PR 靠这里的定时任务
# 对比「最新 commit 是否已部署」来补发，最坏延迟 5 分钟。
on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never drop a mid-flight publish

jobs:
  # scheduled catch-up: skip when the latest main commit is already deployed
  needs-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' || echo "")
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "up to date: ${{ github.sha }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending publish: HEAD ${{ github.sha }} vs last deployed $last"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: needs-publish
    if: github.event_name != 'schedule' || needs.needs-publish.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate entries (fail before publishing)
        run: python3 scripts/validate.py --no-network

      - name: Build site
        run: python3 scripts/make_website.py --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
