name: Deploy website

# main 收到合并后的 push → 重建站点并发布到 GitHub Pages
# (页面地址 = https://coll.i2pl.com/，构建产物内含 CNAME 文件)
on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never drop a mid-flight publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate entries (fail before publishing)
        run: python3 scripts/validate.py --no-network

      - name: Build site
        run: python3 scripts/make_website.py --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
