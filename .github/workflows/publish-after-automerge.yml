name: Merge and publish approved PRs

# Native auto-merge merges the PR with the repository's GITHUB_TOKEN, and
# events triggered by GITHUB_TOKEN (push, pull_request closed) do not start
# new workflow runs — so a bot-merged PR would never reach "Deploy website"
# on its own (first observed with PR #2: merged but not published).
#
# v1 of this workflow polled for the merge as a PR check, which deadlocked:
# native auto-merge waits for every check on the PR, including ours (PR #3,
# mergeStateStatus UNSTABLE). So v2 does the merge itself instead of waiting:
#
#   human approves the review (normal event) -> this workflow merges the PR
#   with GITHUB_TOKEN (the ruleset is satisfied: approval + required checks)
#   -> starts the deploy via workflow_dispatch, the one event GITHUB_TOKEN
#   is allowed to trigger.

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: write
  actions: write

concurrency:
  group: merge-and-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge-and-publish:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge (squash), then dispatch the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # required checks usually finish before the review lands; retry for
          # up to ~3 minutes in case one is still running at approve time
          merged=false
          for i in $(seq 1 18); do
            state=$(gh pr view "$PR" --json state --jq .state || echo UNKNOWN)
            if [ "$state" = "MERGED" ]; then merged=true; break; fi
            if gh pr merge "$PR" --squash 2>/dev/null; then
              state=$(gh pr view "$PR" --json state --jq .state || echo UNKNOWN)
              if [ "$state" = "MERGED" ]; then merged=true; break; fi
            fi
            sleep 10
          done
          if [ "$merged" != "true" ]; then
            echo "PR not merged within the timeout - check required checks, then dispatch the deploy manually:"
            echo "  gh workflow run deploy.yml --ref main"
            exit 0
          fi
          gh workflow run deploy.yml --ref main
          echo "deploy dispatched"
